name: Refresh public profile activity

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'mhatreanuj57-alt/mhatreanuj57-alt'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow==12.3.0
      - run: python scripts/refresh_activity.py --check
      - run: python scripts/refresh_activity.py
      - name: Commit refreshed activity if changed
        run: |
          git add -- assets/activity.json assets/activity.gif assets/activity-static.png assets/github-glance.png README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public contribution activity'
          git push origin HEAD:main
